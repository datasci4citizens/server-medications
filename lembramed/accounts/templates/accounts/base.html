<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>LembraMed</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }
        header {
            background: #4f46e5;
            color: white;
            padding: 15px;
            text-align: center;
        }
        main {
            max-width: 400px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
        }
        a {
            text-decoration: none;
            color: #4f46e5;
            font-weight: bold;
        }
        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background: #4338ca;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .text-center {
            text-align: center;
        }
    </style>
</head>
<body>

<header>
    <h1>💊 LembraMed</h1>
</header>

<main>
    {% block content %}{% endblock %}
</main>

</body>
</html>
